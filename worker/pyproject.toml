[project]
name = "orbithire-worker"
version = "0.1.0"
description = "OrbitHire background worker: Postgres task queue (fetch_jobs, rank_jobs, render_pdf, ...)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "boto3>=1.34",
    "python-jobspy>=1.1.80",
    "pyyaml>=6.0",
    "typst>=0.13",
    "openai>=1.40",
    "anthropic>=0.40",
]

[project.scripts]
worker = "orbithire_worker.main:run"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orbithire_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
